events {}

http {
    upstream menu {
        server menu-api:4000;
    }

    upstream order {
        server order-api:4000;
    }

    upstream payment {
        server order-api:4000;
    }

    upstream kitchen {
        server order-api:4000;
    }

    server {
        server_name app.com;
         
        location /menu {
            proxy_pass http://menu;
        }

        location /order {
            proxy_pass http://order;
        }

        location /payment {
            proxy_pass http://payment;
        }

        location /kitchen {
            proxy_pass http://kitchen;
        }
    }
}
