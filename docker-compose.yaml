  db:
    image: postgres:16
    container_name: postgres_db
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
#    networks:
#      - services
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  menu:
    container_name: menu
    build:
      context: ./services/menu
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
#    networks:
#      - services
    restart: always
    env_file:
      - ./services/menu/.env
    depends_on:
      db: 
        condition: service_healthy

  order:
    container_name: order
    build:
      context: ./services/order
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
#    networks:
#      - services
    restart: always
    env_file:
      - ./services/order/.env
    depends_on:
      db: 
        condition: service_healthy

  payment:
    container_name: payment
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
#    networks:
#      - services
    restart: always
    env_file:
      - ./services/payment/.env
    depends_on:
      db: 
        condition: service_healthy

  kitchen:
    container_name: kitchen
    build:
      context: ./services/kitchen
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
#    networks:
#      - services
    restart: always
    env_file:
      - ./services/kitchen/.env
    depends_on:
      db: 
        condition: service_healthy

  notification:
    container_name: notification
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
#    networks:
#      - services
    restart: always
    env_file:
      - ./services/notification/.env
    depends_on:
      db: 
        condition: service_healthy

