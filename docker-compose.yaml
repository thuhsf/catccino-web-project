services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - services

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - services

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka2
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9093:9093"
    networks:
      - services

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9093
    depends_on:
      - kafka1
      - kafka2
    networks:
      - services

  db:
    image: postgres:16
    container_name: postgres_db
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - services
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  menu:
    container_name: menu
    build:
      context: ./services/menu
      dockerfile: Dockerfile
    networks:
      - services
    restart: always
    env_file:
      - ./services/menu/.env
    depends_on:
      db:
        condition: service_healthy
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started

  order:
    container_name: order
    build:
      context: ./services/order
      dockerfile: Dockerfile
    networks:
      - services
    restart: always
    env_file:
      - ./services/order/.env
    depends_on:
      db:
        condition: service_healthy
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started

  payment:
    container_name: payment
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    networks:
      - services
    restart: always
    env_file:
      - ./services/payment/.env
    depends_on:
      db:
        condition: service_healthy
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started

  kitchen:
    container_name: kitchen
    build:
      context: ./services/kitchen
      dockerfile: Dockerfile
    networks:
      - services
    restart: always
    env_file:
      - ./services/kitchen/.env
    depends_on:
      db:
        condition: service_healthy
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started

  notification:
    container_name: notification
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    networks:
      - services
    restart: always
    env_file:
      - ./services/notification/.env
    depends_on:
      db:
        condition: service_healthy
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started

  nginx:
    image: nginx:latest
    container_name: nginx
    build: nginx
    ports:
      - 80:80
    volumes:
      - ./nginx:/etc/nginx/
    depends_on:
      - menu
    networks:
      - services

networks:
  services:
    driver: bridge

volumes:
  db_data:
    driver: local